name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/new-session-ombj5n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the definition-of-done tests
        run: node tests/build.test.js

      - name: Generate the calendar feed
        run: node tools/make-ics.js

      # The site carries the app and nothing else: no docs, tests, tools or
      # agent notes. A file the phone loads must be listed here (and in sw.js).
      - name: Collect the app
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js training.ics css js data fonts icons _site/
          test -s _site/index.html && test -s _site/js/app.js && test -s _site/training.ics

      - name: Configure Pages (enables the site on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
