<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Week OS</title>
  <meta name="description" content="One block. One race. What am I doing right now, today, and this week.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Week OS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The tab bar is position:fixed, so where it sits in the DOM is purely a
       tab-order decision and has no visual effect. It used to come last, which
       meant twenty tab presses through a whole day before reaching primary
       navigation. First is both conventional and free. -->
  <nav class="tabbar" aria-label="Primary">
    <button data-nav="today" class="tab active">Today</button>
    <button data-nav="week" class="tab">Week</button>
    <button data-nav="more" class="tab" aria-haspopup="true" aria-expanded="false" aria-controls="sheet-backdrop">More</button>
  </nav>

  <header class="topbar" id="topbar">
    <div class="topbar-brand">WEEK<span>OS</span></div>
    <button class="topbar-week" id="hdr-week" aria-label="Current week"></button>
    <div class="topbar-count" id="hdr-count" aria-label="Race countdown"></div>
  </header>

  <main id="view" class="view"></main>

  <div class="sheet-backdrop hidden" id="sheet-backdrop">
    <div class="sheet" role="menu">
      <button data-nav="plan" class="sheet-item">30-week plan</button>
      <button data-nav="ref" class="sheet-item">Reference — paces · shoes · rules</button>
      <button data-nav="close" class="sheet-item sheet-cancel">Close</button>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite">
    <span>Updated</span>
    <button id="toast-reload">Reload</button>
  </div>

  <script src="data/plan.js"></script>
  <script src="js/day-builder.js"></script>
  <script src="js/ef-chart.js"></script>
  <script src="js/run-progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
