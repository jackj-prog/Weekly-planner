<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Week OS app icon — calendar + runner, on the v4.38 palette.
       Full bleed: iOS masks apple-touch-icon to its own superellipse, so
       baking rounded corners in here would double them.
       Vector source for icons/icon-*.png (rendered by tools/make-icons.js). -->
  <defs>
    <!-- The runner and its speed lines cross the calendar's edge. Each is
         drawn twice: once fat in the ground colour to knock a gap through
         whatever sits behind, then again at true weight on top. -->
    <!-- What makes a stick figure read as RUNNING rather than standing:
         a torso that leans into the direction of travel, elbows bent to a
         visible vertex, and — most of all — legs that are not mirror images.
         The lead leg drives forward with the knee high and the shin dropped
         under it; the trailing leg stays long and extends back. -->
    <g id="runner">
      <circle cx="800" cy="502" r="50"/>
      <path d="M 772 566 L 682 700"/>
      <path d="M 756 592 L 686 596 L 644 556"/>
      <path d="M 756 592 L 856 630 L 884 716"/>
      <path d="M 682 700 L 592 786 L 514 858"/>
      <path d="M 682 700 L 780 728 L 772 850"/>
    </g>
    <g id="speed">
      <path d="M 400 666 L 524 666"/>
      <path d="M 348 736 L 500 736"/>
      <path d="M 392 806 L 476 806"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="#141414"/>

  <!-- calendar body -->
  <rect x="200" y="250" width="540" height="440" rx="58" fill="none" stroke="#ececec" stroke-width="42"/>
  <!-- header rule -->
  <line x1="221" y1="372" x2="719" y2="372" stroke="#ececec" stroke-width="40"/>

  <!-- binding posts, knocked out of the header so they read as separate -->
  <rect x="330" y="176" width="50" height="126" rx="25" fill="#141414" stroke="#141414" stroke-width="26"/>
  <rect x="560" y="176" width="50" height="126" rx="25" fill="#141414" stroke="#141414" stroke-width="26"/>
  <rect x="330" y="176" width="50" height="126" rx="25" fill="#ececec"/>
  <rect x="560" y="176" width="50" height="126" rx="25" fill="#ececec"/>

  <!-- date cells: one red — the day you are on -->
  <rect x="281" y="424" width="80" height="80" rx="18" fill="#3d3d3d"/>
  <rect x="381" y="424" width="80" height="80" rx="18" fill="#e50914"/>
  <rect x="481" y="424" width="80" height="80" rx="18" fill="#3d3d3d"/>
  <rect x="581" y="424" width="80" height="80" rx="18" fill="#3d3d3d"/>
  <rect x="281" y="524" width="80" height="80" rx="18" fill="#3d3d3d"/>
  <rect x="381" y="524" width="80" height="80" rx="18" fill="#3d3d3d"/>
  <rect x="481" y="524" width="80" height="80" rx="18" fill="#3d3d3d"/>

  <!-- speed lines: gap first, then the red -->
  <use href="#speed" fill="none" stroke="#141414" stroke-width="54" stroke-linecap="round"/>
  <use href="#speed" fill="none" stroke="#e50914" stroke-width="32" stroke-linecap="round"/>

  <!-- runner: gap first, then the white -->
  <use href="#runner" fill="#141414" stroke="#141414" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#runner" fill="#ececec" stroke="#ececec" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
